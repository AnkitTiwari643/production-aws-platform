name: terraform-apply
on:
  push:
    branches: [main]
    paths: ['terraform/**']
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VERSION: 1.9.8

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: prod  # <-- separate infra approval gate. Require reviewers in repo Settings > Environments > prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: ${{ env.TF_VERSION }}, terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false
        working-directory: terraform
      - run: terraform apply -auto-approve -input=false -var-file=envs/prod.tfvars
        working-directory: terraform
