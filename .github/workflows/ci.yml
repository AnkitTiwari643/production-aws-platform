name: ci
on:
  push:
    branches: [main]
    paths: ['app/**']
  pull_request:
    paths: ['app/**']
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: coupon-platform-dev

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm --prefix app install --omit=dev
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build
        run: docker build -t $ECR_REPO:${{ github.sha }} ./app
      - name: Trivy scan (block HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPO }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          ECR_URL=${{ secrets.ECR_URL }}
          docker tag $ECR_REPO:${{ github.sha }} $ECR_URL:${{ github.sha }}
          docker tag $ECR_REPO:${{ github.sha }} $ECR_URL:latest
          docker push $ECR_URL:${{ github.sha }}
          docker push $ECR_URL:latest
