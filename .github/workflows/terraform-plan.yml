name: terraform-plan
on:
  pull_request:
    paths: ['terraform/**']
permissions:
  id-token: write
  contents: read
  pull-requests: write
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VERSION: 1.9.8

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: ${{ env.TF_VERSION }} }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -input=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform
      - name: Plan dev
        id: plan
        run: terraform plan -input=false -no-color -var-file=envs/dev.tfvars -out=tfplan
        working-directory: terraform
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Terraform plan succeeded. Merge to `main` requires 2 approvals + `prod` environment gate on apply.'
            })
